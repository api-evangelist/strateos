name: Strateos
description: >-
  Strateos operates a robotic cloud laboratory for the life sciences, delivering
  Cloud Lab Automation-as-a-Service so scientists can design, run, and analyze
  wet-lab experiments remotely and programmatically. Originally founded as
  Transcriptic, Strateos couples high-throughput robotic lab automation with the
  Autoprotocol standard and a JSON:API-based web API, letting researchers submit
  protocols, launch runs, manage projects, inventory, and datasets, and pull
  results into downstream ML and data-engineering pipelines. It is backed by DCVC
  and Lux Capital.
