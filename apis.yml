apis:
- name: Strateos Web API
  description: >-
    The Strateos / Transcriptic web API is a JSON:API-based interface for managing
    organizations, projects, runs, datasets, inventory, protocols, and packages on
    the robotic cloud lab. It is consumed through the official Transcriptic (TxPy)
    Python client and CLI, or directly over HTTPS with API-key, HTTP-Signature, or
    bearer-token authentication.
